<style>
  :root {
    --paper: #FFFFFF; --subtle: #F5F5F5; --ink: #0A0A0A; --ink-2: #2E2E2E; --muted: #6B6B6B;
    --line: #E5E5E5; --signal: #12B76A;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    display: flex; justify-content: center; align-items: center;
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 var(--sans);
    padding-block: calc(40px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; }

  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; letter-spacing: -0.015em; color: var(--ink); text-decoration: none; }
  .brand svg { width: 28px; height: 28px; flex: none; }
  .brand .wm span { font-weight: 400; color: var(--muted); }

  .name { font-weight: 600; font-size: 48px; line-height: 1; letter-spacing: -0.035em; margin: 56px 0 10px; }
  .title { margin: 0; font-size: 15px; color: var(--muted); }
  .line { font-size: 18px; line-height: 1.4; color: var(--ink-2);
    margin: 28px 0 0; padding-top: 22px; border-top: 1px solid var(--line); }

  .actions { display: grid; gap: 10px; margin-top: 36px; }
  .btn { display: block; text-align: center; padding: 14px 20px; font: 500 15px/1.2 var(--sans);
    text-decoration: none; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--paper); }
  .btn:hover { background: var(--subtle); }
  .btn-solid { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn-solid:hover { background: var(--ink-2); border-color: var(--ink-2); }
  .btn:focus-visible, .row:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

  .list { margin: 36px 0 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 14px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .k { font-size: 13px; font-weight: 500; color: var(--muted); flex: none; }
  .v { margin: 0; font-size: 15px; text-align: right; min-width: 0; overflow-wrap: anywhere; }
