<style>
  :root {
    --ground: #E8EBE7; --pine: #1E3A32; --pine-soft: #3E6B5D; --wheat: #D9B866;
    --ink: #1E2A26; --muted: #46504C; --rule: #B9C2BC; --on-pine: #EEF0EB;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    display: flex; justify-content: center; align-items: center;
    background: var(--ground); color: var(--ink);
    font: 16px/1.5 var(--sans);
    padding-block: calc(40px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; }

  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 19px; color: var(--pine); text-decoration: none; }
  .brand svg { width: 26px; height: 26px; flex: none; }

  .name { font-family: var(--serif); font-weight: 300; color: var(--pine);
    font-size: 54px; line-height: 1; letter-spacing: -0.02em; margin: 56px 0 10px; }
  .title { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .line { font-family: var(--serif); font-style: italic; font-size: 21px; line-height: 1.35; color: var(--ink);
    margin: 28px 0 0; padding-top: 22px; border-top: 1px solid var(--rule); }

  .actions { display: grid; gap: 10px; margin-top: 36px; }
  .btn { display: block; text-align: center; padding: 15px 20px; font: 500 15px/1.2 var(--sans);
    text-decoration: none; border: 1px solid var(--pine); color: var(--pine); background: transparent; }
  .btn-solid { background: var(--pine); color: var(--on-pine); }
  .btn:hover { background: var(--pine-soft); border-color: var(--pine-soft); color: var(--on-pine); }
  .btn:focus-visible, .row:focus-visible { outline: 2px solid var(--wheat); outline-offset: 3px; }

  .list { margin: 36px 0 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 14px 0; border-top: 1px solid var(--rule); color: inherit; text-decoration: none; }
  .row:last-child { border-bottom: 1px solid var(--rule); }
  .k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); flex: none; }
  .v { margin: 0; font-size: 15px; text-align: right; min-width: 0; overflow-wrap: anywhere; }
